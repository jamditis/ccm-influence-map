/* ---------- constants ---------- */

  { id: "media", label: "Journalism and media", color: "var(--s-media)", hex: "#2a78d6" },

  last: (a, b) => (a.last || "").localeCompare(b.last || ""),

  programs: (a, b) => a.programList.length - b.programList.length,

};
const DAY = 864e5;
const TYPE_LABEL = { slack: "Slack messages", slack_dm: "Slack DMs", slack_mention: "Slack mentions", email: "Emails", email_sent: "Emails sent", meeting: "Meetings", note: "Notes", research: "Research notes", event: "Events", call: "Calls" };

const STRONG = 55, MEDIUM = 25;

/* ---------- mount ---------- */

shadow.innerHTML = `<style>${CSS}</style>${HTML}`;

function fitHeight() {
  const header = document.getElementById("header-section");
  let fixedTop = 0;
  if (header && getComputedStyle(header).position === "fixed") {
    fixedTop = header.getBoundingClientRect().bottom;
    for (const el of header.querySelectorAll("*")) { const r = el.getBoundingClientRect(); if (r.height && r.width && r.top < 200) fixedTop = Math.max(fixedTop, r.bottom); }
    fixedTop = Math.ceil(Math.min(fixedTop, 160));
  }
  host.style.marginTop = fixedTop + "px";
  const top = host.getBoundingClientRect().top + window.scrollY;
  const h = Math.max(520, window.innerHeight - Math.max(0, Math.min(top, 160)));
  host.style.setProperty("--ccmnet-height", h + "px");
}
fitHeight();
window.addEventListener("resize", fitHeight);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : (many || one + "s")}`;
const fmtDate = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "";
const shortName = name => { const p = name.split(" "); return p.length > 1 ? `${p[0]} ${p[p.length - 1][0]}.` : name; };

async function loadGraph() {
  const el = document.getElementById("ccmnet-graph");
  if (el.dataset.encoding === "gzip-base64") {
    const bin = Uint8Array.from(atob(el.textContent.trim()), c => c.charCodeAt(0));
    const text = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return JSON.parse(text);
  }
  return JSON.parse(el.textContent);
}

/* ---------- model ---------- */
let M;
function groupOf(sector, mediaSectors) {
  if (mediaSectors.has(sector)) return "media";
  if (sector === "University") return "uni";
  if (sector === "Funder" || sector === "Civic") return "civic";
  return "other";
}
function monthsSince(iso, now) { return iso ? (now - Date.parse(iso + "T12:00:00Z")) / (DAY * 30.44) : null; }

function buildModel(G) {
  const now = Date.now();
  const media = new Set(G.mediaSectors || []);
  const byId = new Map(G.nodes.map(n => [n.id, n]));
  const staff = G.nodes.filter(n => n.kind === "staff").sort((a, b) => a.name.localeCompare(b.name));
  const staffIds = new Set(staff.map(s => s.id));
  const programs = G.nodes.filter(n => n.kind === "program");
  const programOf = new Map(), programEvidence = new Map(), orgsOf = new Map(), peopleOf = new Map(), social = new Map();
  const add = (map, k, v) => { if (!map.has(k)) map.set(k, new Set()); map.get(k).add(v); };
  for (const e of G.edges) {
    const s = byId.get(e.source), t = byId.get(e.target);
    if (!s || !t) continue;
    if (t.kind === "program" && s.kind !== "program") { add(programOf, s.id, t.id); programEvidence.set(s.id + "|" + t.name, e.relation); }
    else if (s.kind === "program" && t.kind !== "program") { add(programOf, t.id, s.id); programEvidence.set(t.id + "|" + s.name, e.relation); }
    if (/affiliation/i.test(e.relation)) {
      const [p, o] = s.kind === "person" && t.kind === "organization" ? [s, t] : t.kind === "person" && s.kind === "organization" ? [t, s] : [];
      if (p) { add(orgsOf, p.id, o.id); add(peopleOf, o.id, p.id); }
    }
    if (e.network !== "CRM" && staffIds.has(e.source) && !staffIds.has(e.target)) {
      if (!social.has(e.target)) social.set(e.target, new Map());
      const per = social.get(e.target);
      if (!per.has(e.source)) per.set(e.source, {});
      const rec = per.get(e.source);
      rec[e.relation] = (rec[e.relation] || 0) + e.count;

    const pb = (b.id === S.sel ? 4 : 0) + (focus && focus.has(b.id) ? 2 : 0) + (b.staff ? 1 : 0);

$("view-list").addEventListener("click", ev => { const tr = ev.target.closest("tr[data-id]"); if (tr) set({ sel: tr.dataset.id }, { keepLimit: true }); });
$("view-list").addEventListener("keydown", ev => { const tr = ev.target.closest("tr[data-id]"); if (tr && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); set({ sel: tr.dataset.id }, { keepLimit: true }); shadow.querySelector(`tr[data-id="${CSS_ESC(tr.dataset.id)}"]`)?.focus(); } });
const CSS_ESC = s => (window.CSS && window.CSS.escape ? window.CSS.escape(s) : s);
$("copy").onclick = async () => {
  writeHash();
  try { await navigator.clipboard.writeText(location.href); toast("Link copied. It opens this exact view."); }
  catch { window.prompt("Copy this link", location.href); }
};
$("csv").onclick = () => {
  const cell = v => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = ["Name", "Type", "Organization", "Sector", "Strength", "Tier", "Last contact", "CRM interactions", "Last 90 days", "Held by", "Programs", "Board items", "CRM status", "Suggested next step"];
  const rows = M.current.map(e => [e.name, e.kind, e.companies.join("; "), e.sector, e.strength, e.tier, e.last, e.node.crmCount || 0, e.node.recent90 ?? "",
    e.holders.map(id => M.byId.get(id).name).join("; "), e.programList.join("; "), e.node.projects || 0, e.crm || "Not in CRM", e.next ? e.next.short : ""]);
  const blob = new Blob(["﻿" + [head, ...rows].map(r => r.map(cell).join(",")).join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ccm-relationships-${new Date().toISOString().slice(0, 10)}.csv`;
  shadow.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`Downloaded ${plural(rows.length, "row")}.`);
};
$("about").onclick = () => $("about-dlg").showModal();
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }
window.addEventListener("hashchange", () => { readHash(); render(); });
new ResizeObserver(() => { const w = net.w; resizeCanvas(); if (S.v === "network" && Math.abs(w - net.w) > 120) { net.key = ""; render({ keepPanel: true }); } }).observe($("view-network"));

/* ---------- start ---------- */
$("panel-inner").innerHTML = `<p class="note">Loading relationships…</p>`;
loadGraph().then(G => {
  M = buildModel(G);
  fillControls();
  renderAbout();
  readHash();
  render();
}).catch(err => {
  $("main").innerHTML = `<div class="empty" style="grid-column:1/-1"><strong>The map could not load.</strong>${esc(err.message)}</div>`;
});
})();
</script>
